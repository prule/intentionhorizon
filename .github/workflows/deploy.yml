name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize per ref, not globally: a single shared group meant every open PR's
# test run queued behind the same slot and got cancelled by the next one, so
# most PRs never reported a result. Deploy serialization lives on the deploy
# job instead. Superseded PR commits are cancelled; main pushes are not, so no
# deploy is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build the app and run the e2e suite on every push and pull request.
  # A failing build or e2e test fails this job, which gates the deploy below.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm must be on PATH before setup-node so its `cache: pnpm` works.
      # Version is read from package.json's "packageManager" field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Only Chromium is configured in playwright.config.ts.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build

      # Fast unit suite runs before e2e so logic failures surface before the
      # slower browser run; a failing unit test fails the job and gates deploy.
      - run: pnpm test:unit

      # Playwright starts its own dev server (CI=true disables reuse), and the
      # e2e seed hook is gated behind import.meta.env.DEV, so tests run against
      # the dev server rather than the production build.
      - run: pnpm e2e

  build:
    # Only build/deploy Pages on pushes to main, and only after tests pass.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    # One Pages deploy at a time; let an in-progress one finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
