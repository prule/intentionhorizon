sonar.projectKey=intentionhorizon
sonar.sources=.
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,coverage/**
# Unit coverage covers src/ only; config, e2e and build scripts have no unit tests.
sonar.coverage.exclusions=**/*.config.*,e2e/**,scripts/**,src/test/**
# Written by `pnpm test` (vitest --coverage); run it before sonar-check.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
